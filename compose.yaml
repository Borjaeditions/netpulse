name: netpulse

services:
  dev:
    image: node:24-bookworm-slim
    container_name: netpulse-dev

    working_dir: /app

    user: "${PUID:-1000}:${PGID:-1000}"

    volumes:
      - ./:/app
      - node_modules:/app/node_modules

    environment:
      NODE_ENV: development
      TZ: America/Mexico_City

    command: ["sleep", "infinity"]

    restart: unless-stopped

    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  node_modules:
