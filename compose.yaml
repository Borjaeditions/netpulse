name: netpulse

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    image: netpulse-api:local
    container_name: netpulse-api

    environment:
      NODE_ENV: production
      PORT: "3100"
      TZ: America/Mexico_City

    ports:
      - "192.168.2.20:3100:3100"

    restart: unless-stopped

    networks:
      - internal

networks:
  internal:
    driver: bridge