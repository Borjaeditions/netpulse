
name: netpulse

services:

  # ==========================================
  # API - Fastify + LibreSpeed + SQLite
  # ==========================================

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    image: netpulse-api:local
    container_name: netpulse-api

    environment:
      NODE_ENV: production
      PORT: "3100"
      TZ: America/Mexico_City
      SQLITE_PATH: /app/data/netpulse.db

    volumes:
      - ./data:/app/data

    expose:
      - "3100"

    restart: unless-stopped

    networks:
      - internal

  # ==========================================
  # WEB - React + Nginx
  # ==========================================

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    image: netpulse-web:local
    container_name: netpulse-web

    depends_on:
      - api

    ports:
      - "8080:80"

    restart: unless-stopped

    networks:
      - internal

# ==========================================
# Red interna Docker
# ==========================================

networks:
  internal:
    driver: bridge
